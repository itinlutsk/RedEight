openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Red Eight Workshop API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Furniture products
  - name: categories
    description: Product categories
  - name: types
    description: Product types (residential, restaurant, etc.)
  - name: services
    description: Workshop services
  - name: blog
    description: Blog posts
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: typeId
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all product categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /types:
    get:
      operationId: listTypes
      tags: [types]
      summary: List all project types
      responses:
        "200":
          description: List of types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectType"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all workshop services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /blog:
    get:
      operationId: listBlogPosts
      tags: [blog]
      summary: List all blog posts
      parameters:
        - name: tag
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog/{id}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a blog post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found

  /homepage:
    get:
      operationId: getHomepageData
      tags: [products]
      summary: Aggregated homepage data (featured products, services, recent blog)
      responses:
        "200":
          description: Homepage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomepageData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Product:
      type: object
      required: [id, name, description, categoryId, typeId, sku]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        color:
          type: array
          items:
            type: string
        categoryId:
          type: string
        typeId:
          type: string
        price:
          type: number
        imageFiles:
          type: array
          items:
            type: string
        imageUrls:
          type: array
          items:
            type: string
        sku:
          type: string
        badge:
          type: ["string", "null"]
        badgeType:
          type: ["string", "null"]

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    ProjectType:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    Service:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: ["string", "null"]

    BlogPost:
      type: object
      required: [id, name, description, created, author, tag, readTime]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created:
          type: string
        author:
          type: string
        textSecondary:
          type: string
        imageFiles:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        tag:
          type: string
        readTime:
          type: string
        featured:
          type: boolean

    HomepageData:
      type: object
      required: [featuredProducts, services, recentPosts]
      properties:
        featuredProducts:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        recentPosts:
          type: array
          items:
            $ref: "#/components/schemas/BlogPost"
