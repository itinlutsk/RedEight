kind = "web"
previewPath = "/"
title = "Red Eight Workshop"
version = "1.0.0"
id = "artifacts/red-eight"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24554

[services.development]
run = "pnpm --filter @workspace/red-eight run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/red-eight", "run", "build" ]
publicDir = "artifacts/red-eight/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24554"
BASE_PATH = "/"
